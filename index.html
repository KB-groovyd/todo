<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>TODO</h1>

    <form id="new-todo-form" class="new-todo" autocomplete="off">
      <button type="button" id="toggle-all" class="toggle-all" title="すべて完了／未完了にする" aria-label="すべて完了／未完了にする">✓</button>
      <input id="new-todo" type="text" placeholder="やることを入力して Enter" aria-label="新しいTODO" maxlength="200" autofocus>
      <button type="submit" class="add">追加</button>
    </form>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <p id="empty" class="empty" hidden></p>

    <footer id="footer" class="footer" hidden>
      <span id="count" class="count"></span>
      <nav class="filters" aria-label="表示切り替え">
        <a href="#/" data-filter="all">すべて</a>
        <a href="#/active" data-filter="active">未完了</a>
        <a href="#/completed" data-filter="completed">完了済み</a>
      </nav>
      <button type="button" id="clear-completed" class="clear-completed">完了済みを削除</button>
    </footer>

    <p class="hint">ダブルクリックで編集 ・ Enter で確定 ・ Esc でキャンセル</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
